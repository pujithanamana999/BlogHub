<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogHub - Create Blog</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            BlogHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <!-- Create Blog Section -->
    <main class="create-blog-section">

        <div class="create-blog-container">

            <h1>Create a New Blog</h1>

            <p class="create-blog-description">
                Share your thoughts and ideas with the BlogHub community.
            </p>


            <form id="blogForm">

                <!-- Blog Title -->
                <div class="form-group">

                    <label for="blogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="blogTitle"
                        placeholder="Enter your blog title"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="blogCategory">
                        Category
                    </label>

                    <select id="blogCategory" required>

                        <option value="">
                            Select a category
                        </option>

                        <option value="technology">
                            Technology
                        </option>

                        <option value="programming">
                            Programming
                        </option>

                        <option value="ai">
                            Artificial Intelligence
                        </option>

                        <option value="cybersecurity">
                            Cybersecurity
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Blog Content -->
                <div class="form-group">

                    <label for="blogContent">
                        Blog Content
                    </label>

                    <textarea
                        id="blogContent"
                        rows="10"
                        placeholder="Write your blog content here..."
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->
                <div class="create-blog-actions">

                    <a
                        href="dashboard.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="publish-button"
                    >
                        Publish Blog
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 BlogHub. All Rights Reserved.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
