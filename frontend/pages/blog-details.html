<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogHub - Blog Details</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            BlogHub
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <!-- Blog Details -->
    <main class="page">

        <div id="blogDetails">

            <p>Loading blog...</p>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 BlogHub. All Rights Reserved.
        </p>

    </footer>


    <!-- Blog Details JavaScript -->
    <script>

        const blogDetails = document.getElementById("blogDetails");


        // Get blog ID from URL
        const urlParams = new URLSearchParams(window.location.search);

        const blogId = urlParams.get("id");


        // Check Blog ID
        if (!blogId) {

            blogDetails.innerHTML = `
                <h2>Blog not found</h2>
                <p>No blog ID was provided.</p>

                <a href="dashboard.html">
                    <button class="auth-button">
                        Back to Dashboard
                    </button>
                </a>
            `;

        } else {


            // Fetch single blog
            fetch(`http://localhost:5000/api/blogs/${blogId}`)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Blog not found");
                    }

                    return response.json();

                })

                .then(data => {

                    const blog = data.blog;


                    blogDetails.innerHTML = `

                        <article class="blog-details">

                            <h1>${blog.title}</h1>

                            <p>
                                <strong>Category:</strong>
                                ${blog.category}
                            </p>

                            <p>
                                <strong>Author:</strong>
                                ${blog.author}
                            </p>

                            <hr>

                            <div class="blog-content">

                                <p>
                                    ${blog.content}
                                </p>

                            </div>

                            <br>

                            <a href="dashboard.html">

                                <button class="auth-button">
                                    Back to Dashboard
                                </button>

                            </a>

                        </article>

                    `;

                })

                .catch(error => {

                    console.error("Error:", error);

                    blogDetails.innerHTML = `

                        <h2>Unable to load blog</h2>

                        <p>
                            The requested blog could not be found.
                        </p>

                        <a href="dashboard.html">

                            <button class="auth-button">
                                Back to Dashboard
                            </button>

                        </a>

                    `;

                });

        }

    </script>

</body>

</html>
